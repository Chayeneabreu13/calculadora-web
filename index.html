<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <main class="calculadora">
        <h1>Calculadora</h1>
        <div class="display">
            <input type="text" id="resultado" disabled>
        </div>
            <div class="botoes">
                <button class="acao">C</button>
                <button class="acao">%</button>
                <button class="acao">⌫</button>
                <button class="operador">÷</button>
                
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operador">×</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operador">-</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operador">+</button>

                <button class="zero">0</button>
                <button>,</button>
                <button>=</button>
            </div>
         </main>
     <script src="script.js"></script>
</body>
</html>
